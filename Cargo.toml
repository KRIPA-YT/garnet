[package]
name = "garnet"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
base = "0.1.0"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
envy = "0.4.2"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["chrono", "macros", "postgres", "runtime-tokio", "uuid"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "10.0.1", features = ["axum"] }
uuid = { version = "1.26.1", features = ["serde", "v4"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }   # UM, ACTUALLY
nursery = { level = "warn", priority = -1 }    # BETA LINTS
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
